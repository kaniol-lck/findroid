name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ device-id-fix ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble libre debug
        run: ./gradlew assembleLibreDebug --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p out
          find app -name '*-libre-*-debug.apk' -exec cp {} out/ \;
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: findroid-deviceid-fix-apks
          path: out/*.apk
